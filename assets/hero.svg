<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" fill="none" role="img" aria-label="Pedro - Engenheiro Mecatronico e Full Stack - do codigo ao mundo real">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#07231c"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ECF8E"/>
      <stop offset="100%" stop-color="#2bb673"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect x="0" y="0" width="900" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="300" fill="url(#bg)"/>

    <!-- starfield -->
    <g fill="#9bd9c0">
      <circle cx="120" cy="40" r="1.2" opacity="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="30" r="1" opacity="0.4"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="48" r="1.3" opacity="0.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="36" r="1" opacity="0.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- faint circuit traces -->
    <g stroke="#1f5d44" stroke-width="1.4" fill="none" opacity="0.5">
      <path d="M0 210 H80 V250 H180"/>
      <path d="M40 300 V268 H120"/>
      <circle cx="80" cy="250" r="2.5" fill="#1f5d44"/>
      <circle cx="180" cy="250" r="2.5" fill="#1f5d44"/>
    </g>

    <!-- drifting code glyphs -->
    <text x="330" y="96" font-family="Fira Code, monospace" font-size="30" fill="#3ECF8E" opacity="0.18" font-weight="700">&lt;/&gt;</text>
    <text x="360" y="210" font-family="Fira Code, monospace" font-size="22" fill="#3ECF8E" opacity="0.14">{ }</text>

    <!-- ===== title block ===== -->
    <text x="40" y="92" font-family="Fira Code, monospace" font-weight="700" font-size="46" fill="#ffffff">PEDRO</text>
    <text x="42" y="120" font-family="Fira Code, monospace" font-size="15" fill="url(#emerald)">do código ao mundo real · from code to the real world</text>
    <rect x="42" y="132" width="0" height="2" fill="#3ECF8E"><animate attributeName="width" values="0;360" dur="1.4s" begin="0.5s" fill="freeze"/></rect>
    <text x="42" y="160" font-family="Fira Code, monospace" font-size="12.5" fill="#cbd5e1">Eng. Mecatrônico · Full Stack Developer</text>

    <!-- domain chips -->
    <g font-family="Fira Code, monospace" font-size="11">
      <g transform="translate(42 184)">
        <rect width="92" height="22" rx="6" fill="none" stroke="#1f5d44"/><text x="46" y="15" text-anchor="middle" fill="#9bd9c0">indústria</text>
      </g>
      <g transform="translate(142 184)">
        <rect width="62" height="22" rx="6" fill="none" stroke="#1f5d44"/><text x="31" y="15" text-anchor="middle" fill="#9bd9c0">IoT</text>
      </g>
      <g transform="translate(212 184)">
        <rect width="98" height="22" rx="6" fill="none" stroke="#1f5d44"/><text x="49" y="15" text-anchor="middle" fill="#9bd9c0">automação</text>
      </g>
      <g transform="translate(318 184)">
        <rect width="62" height="22" rx="6" fill="none" stroke="#1f5d44"/><text x="31" y="15" text-anchor="middle" fill="#9bd9c0">dados</text>
      </g>
    </g>

    <!-- deploy bus: código -> alvos no mundo real -->
    <path id="bus" d="M60 240 H300" stroke="#3ECF8E" stroke-width="1.4" stroke-dasharray="4 6" opacity="0.5"/>
    <text x="40" y="244" font-family="Fira Code, monospace" font-size="11" fill="#3ECF8E">deploy ▸</text>
    <circle r="3.2" fill="#3ECF8E" filter="url(#glow)">
      <animateMotion dur="2.6s" repeatCount="indefinite" path="M62 240 H298"/>
    </circle>

    <!-- ===== terminal window ===== -->
    <g transform="translate(440 64)">
      <rect x="0" y="0" width="420" height="180" rx="10" fill="#0a0f1a" stroke="#1f5d44" stroke-width="1.5"/>
      <rect x="0" y="0" width="420" height="26" rx="10" fill="#11203a"/>
      <rect x="0" y="16" width="420" height="10" fill="#11203a"/>
      <circle cx="16" cy="13" r="4" fill="#ff5f56"/>
      <circle cx="32" cy="13" r="4" fill="#ffbd2e"/>
      <circle cx="48" cy="13" r="4" fill="#27c93f"/>
      <text x="210" y="17" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#5b7083">pedro@dev:~</text>

      <g font-family="Fira Code, monospace" font-size="13">
        <text x="16" y="54"  fill="#3ECF8E">$ deploy --target world</text>
        <text x="16" y="78"  fill="#e6edf3">&gt; supervisão industrial  <tspan fill="#3ECF8E">[ok]</tspan></text>
        <text x="16" y="100" fill="#e6edf3">&gt; IoT · automação        <tspan fill="#3ECF8E">[ok]</tspan></text>
        <text x="16" y="122" fill="#e6edf3">&gt; full stack · dados     <tspan fill="#3ECF8E">[ok]</tspan></text>
        <text x="16" y="148" fill="#3ECF8E">$ status: shipping _<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></text>
        <clipPath id="type"><rect x="0" y="34" width="0" height="130"><animate attributeName="width" values="0;420" dur="3.2s" begin="0.3s" fill="freeze" calcMode="linear"/></rect></clipPath>
      </g>
    </g>

    <!-- bottom border accent -->
    <rect x="0" y="296" width="900" height="4" fill="url(#emerald)"/>
  </g>
</svg>
