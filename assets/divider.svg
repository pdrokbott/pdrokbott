<svg xmlns="http://www.w3.org/2000/svg" width="900" height="28" viewBox="0 0 900 28" fill="none" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#3ECF8E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3ECF8E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3ECF8E" stop-opacity="0"/>
    </linearGradient>
    <filter id="dg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- base line -->
  <line x1="40" y1="14" x2="860" y2="14" stroke="url(#dl)" stroke-width="1.4"/>

  <!-- dashed circuit overlay -->
  <line x1="40" y1="14" x2="860" y2="14" stroke="#3ECF8E" stroke-width="1" stroke-dasharray="2 10" opacity="0.35"/>

  <!-- center node -->
  <g transform="translate(450 14)" filter="url(#dg)">
    <path d="M0 -6 L6 0 L0 6 L-6 0 Z" fill="#3ECF8E"/>
    <circle r="2" fill="#0d1117"/>
  </g>

  <!-- traveling pulse -->
  <circle r="3" fill="#3ECF8E" filter="url(#dg)">
    <animate attributeName="cx" values="60;840;60" dur="5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="cy" values="14;14;14" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1;0" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
