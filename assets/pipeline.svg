<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" fill="none" role="img" aria-label="Do codigo ao mundo real - data pipeline: codigo, ESP32/LoRa, MQTT, ThingsBoard, decisoes">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#06281f"/>
    </linearGradient>
    <linearGradient id="pem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ECF8E"/>
      <stop offset="100%" stop-color="#2bb673"/>
    </linearGradient>
    <filter id="pg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="pcard"><rect x="0" y="0" width="900" height="230" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#pcard)">
    <rect width="900" height="230" fill="url(#pbg)"/>

    <!-- faint dot-grid -->
    <g fill="#1f5d44" opacity="0.35">
      <circle cx="60"  cy="200" r="1"/><circle cx="160" cy="205" r="1"/><circle cx="260" cy="200" r="1"/>
      <circle cx="360" cy="205" r="1"/><circle cx="460" cy="200" r="1"/><circle cx="560" cy="205" r="1"/>
      <circle cx="660" cy="200" r="1"/><circle cx="760" cy="205" r="1"/><circle cx="840" cy="200" r="1"/>
    </g>

    <!-- title -->
    <text x="36" y="34" font-family="Fira Code, monospace" font-size="13" fill="#3ECF8E">$ pedro --pipeline</text>
    <text x="864" y="34" text-anchor="end" font-family="Fira Code, monospace" font-size="12" fill="#5b7083"># do código ao mundo real</text>

    <!-- connecting wire (behind nodes) -->
    <line x1="60" y1="110" x2="852" y2="110" stroke="#1f5d44" stroke-width="2"/>
    <line x1="60" y1="110" x2="852" y2="110" stroke="#3ECF8E" stroke-width="1.4" stroke-dasharray="3 9" opacity="0.55"/>

    <!-- arrowheads between stages -->
    <g fill="#3ECF8E" opacity="0.8">
      <path d="M196 110 l-8 -5 l0 10 Z"/>
      <path d="M384 110 l-8 -5 l0 10 Z"/>
      <path d="M572 110 l-8 -5 l0 10 Z"/>
      <path d="M760 110 l-8 -5 l0 10 Z"/>
    </g>

    <!-- traveling data packet -->
    <circle r="4" fill="#3ECF8E" filter="url(#pg)">
      <animate attributeName="cx" values="70;842;842" keyTimes="0;0.85;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="110;110;110" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.08;0.8;0.85;1" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- ============ NODE 1 · CÓDIGO ============ -->
    <g transform="translate(110 110)">
      <rect x="-42" y="-42" width="84" height="84" rx="12" fill="#0a0f1a" stroke="#1f5d44" stroke-width="1.5"/>
      <!-- mini terminal -->
      <rect x="-22" y="-16" width="44" height="32" rx="3" fill="none" stroke="#3ECF8E" stroke-width="2"/>
      <line x1="-22" y1="-7" x2="22" y2="-7" stroke="#1f5d44" stroke-width="1.6"/>
      <circle cx="-17" cy="-12" r="1.6" fill="#3ECF8E"/>
      <text x="-15" y="9" font-family="Fira Code, monospace" font-weight="700" font-size="13" fill="#3ECF8E">&gt;_<animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></text>
    </g>
    <text x="110" y="172" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" fill="#9bd9c0">código</text>
    <text x="110" y="188" text-anchor="middle" font-family="Fira Code, monospace" font-size="9.5" fill="#5b7083">engenharia</text>

    <!-- ============ NODE 2 · ESP32 / LoRa ============ -->
    <g transform="translate(290 110)">
      <rect x="-42" y="-42" width="84" height="84" rx="12" fill="#0a0f1a" stroke="#1f5d44" stroke-width="1.5"/>
      <!-- chip -->
      <rect x="-13" y="-1" width="26" height="22" rx="3" fill="none" stroke="#3ECF8E" stroke-width="2"/>
      <g stroke="#3ECF8E" stroke-width="1.6">
        <line x1="-9" y1="21" x2="-9" y2="26"/><line x1="0" y1="21" x2="0" y2="26"/><line x1="9" y1="21" x2="9" y2="26"/>
        <line x1="-13" y1="6" x2="-18" y2="6"/><line x1="13" y1="6" x2="18" y2="6"/>
      </g>
      <!-- antenna -->
      <line x1="0" y1="-1" x2="0" y2="-16" stroke="#3ECF8E" stroke-width="2"/>
      <!-- LoRa waves -->
      <g fill="none" stroke="#3ECF8E" stroke-width="1.6">
        <path d="M-9 -24 q9 -7 18 0"><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0s"   repeatCount="indefinite"/></path>
        <path d="M-15 -30 q15 -11 30 0"><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0.5s" repeatCount="indefinite"/></path>
      </g>
    </g>
    <text x="290" y="172" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" fill="#9bd9c0">ESP32 · LoRa</text>
    <text x="290" y="188" text-anchor="middle" font-family="Fira Code, monospace" font-size="9.5" fill="#5b7083">edge wireless</text>

    <!-- ============ NODE 3 · MQTT BROKER ============ -->
    <g transform="translate(470 110)">
      <rect x="-42" y="-42" width="84" height="84" rx="12" fill="#0a0f1a" stroke="#1f5d44" stroke-width="1.5"/>
      <!-- hub -->
      <circle cx="0" cy="2" r="6" fill="none" stroke="#3ECF8E" stroke-width="2"/>
      <circle cx="0" cy="2" r="2.5" fill="#3ECF8E"/>
      <g stroke="#2bb673" stroke-width="1.6">
        <line x1="0" y1="2" x2="-18" y2="-14"/><line x1="0" y1="2" x2="18" y2="-14"/><line x1="0" y1="2" x2="0" y2="24"/>
      </g>
      <circle cx="-18" cy="-14" r="3" fill="#3ECF8E"/>
      <circle cx="18"  cy="-14" r="3" fill="#3ECF8E"/>
      <circle cx="0"   cy="24" r="3" fill="#3ECF8E"><animate attributeName="r" values="3;4.5;3" dur="2s" repeatCount="indefinite"/></circle>
    </g>
    <text x="470" y="172" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" fill="#9bd9c0">MQTT broker</text>
    <text x="470" y="188" text-anchor="middle" font-family="Fira Code, monospace" font-size="9.5" fill="#5b7083">pub / sub</text>

    <!-- ============ NODE 4 · THINGSBOARD ============ -->
    <g transform="translate(650 110)">
      <rect x="-42" y="-42" width="84" height="84" rx="12" fill="#0a0f1a" stroke="#1f5d44" stroke-width="1.5"/>
      <!-- monitor -->
      <rect x="-20" y="-16" width="40" height="28" rx="3" fill="none" stroke="#3ECF8E" stroke-width="2"/>
      <line x1="0" y1="12" x2="0" y2="20" stroke="#3ECF8E" stroke-width="2"/>
      <line x1="-9" y1="22" x2="9" y2="22" stroke="#3ECF8E" stroke-width="2"/>
      <!-- telemetry line -->
      <polyline points="-15,4 -8,-4 -1,2 6,-8 15,-2" fill="none" stroke="#2bb673" stroke-width="1.8" stroke-linejoin="round">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
      </polyline>
    </g>
    <text x="650" y="172" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" fill="#9bd9c0">ThingsBoard</text>
    <text x="650" y="188" text-anchor="middle" font-family="Fira Code, monospace" font-size="9.5" fill="#5b7083">telemetria</text>

    <!-- ============ NODE 5 · DECISÕES ============ -->
    <g transform="translate(810 110)">
      <rect x="-42" y="-42" width="84" height="84" rx="12" fill="#0a0f1a" stroke="#1f5d44" stroke-width="1.5"/>
      <!-- bar chart -->
      <line x1="-20" y1="20" x2="22" y2="20" stroke="#1f5d44" stroke-width="2"/>
      <rect x="-16" y="2" width="8" height="18" fill="#2bb673"><animate attributeName="height" values="18;6;18" dur="2.6s" repeatCount="indefinite"/><animate attributeName="y" values="2;14;2" dur="2.6s" repeatCount="indefinite"/></rect>
      <rect x="-4" y="-6" width="8" height="26" fill="#3ECF8E"><animate attributeName="height" values="26;12;26" dur="2.6s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="y" values="-6;8;-6" dur="2.6s" begin="0.3s" repeatCount="indefinite"/></rect>
      <rect x="8" y="-2" width="8" height="22" fill="#2bb673"><animate attributeName="height" values="22;9;22" dur="2.6s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="y" values="-2;11;-2" dur="2.6s" begin="0.6s" repeatCount="indefinite"/></rect>
      <!-- decision check -->
      <path d="M-18 -16 l4 4 l7 -8" fill="none" stroke="#ffd27a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="810" y="172" text-anchor="middle" font-family="Fira Code, monospace" font-size="11" fill="#9bd9c0">decisões</text>
    <text x="810" y="188" text-anchor="middle" font-family="Fira Code, monospace" font-size="9.5" fill="#5b7083">dashboards</text>

    <!-- bottom accent -->
    <rect x="0" y="226" width="900" height="4" fill="url(#pem)"/>
  </g>
</svg>
