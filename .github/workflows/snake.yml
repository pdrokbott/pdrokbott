name: Generate Snake Animation

on:
  schedule:
    # Roda todo dia às 00:00 UTC para manter a snake atualizada
    - cron: "0 0 * * *"
  workflow_dispatch: # permite rodar manualmente na aba Actions
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Contribuições privadas aparecem porque o perfil tem
          # "Include private contributions on my profile" ativado.
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#3ECF8E
            dist/ocean.gif?color_snake=#3ECF8E&color_dots=#0d1117,#0e4429,#006d32,#26a641,#39d353

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
